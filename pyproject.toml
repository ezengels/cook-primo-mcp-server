[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "primo-mcp-server"
version = "0.1.0"
description = "MCP server for searching Towson University's Albert S. Cook Library (OneSearch, Ex Libris Primo VE): catalogue, articles, databases, and records. Adapted from Aaron Tay's SMU fork."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Gehe Haridas" },
]
maintainers = [
    { name = "Aaron Tay Chee Hsien" },
]
dependencies = [
    # mcp 2.x renamed McpError to MCPError, which librarian_llm.py imports;
    # uv.lock pins 1.28.1, but a plain pip install would pull 2.x.
    "mcp>=1.26.0,<2",
    "httpx>=0.28.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "snowballstemmer>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/ezengels/cook-primo-mcp-server"
Repository = "https://github.com/ezengels/cook-primo-mcp-server"
Upstream = "https://github.com/aarontaycheehsien/primo-mcp-server"
Original = "https://github.com/geheharidas/primo-mcp-server"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[project.scripts]
primo-mcp-server = "primo_mcp_server:main"
primo-profiles = "primo_mcp_server.profile_tools:main"
primo-eval = "primo_mcp_server.evaluate_recommendations:main"
primo-triage = "primo_mcp_server.triage_recommendations:main"

[tool.hatch.build.targets.wheel]
packages = ["src/primo_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the real Primo API, Towson OneSearch by default (run with: pytest -m live)"]
addopts = "-m 'not live'"
